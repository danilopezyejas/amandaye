{% extends "admin/base_site.html" %}
{% load i18n %}
{% block content_title %}<h1>{{ title }}</h1>{% endblock %}
{% block content %}
<style>
  .gestion-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; }
  .gestion-card { background:var(--body-bg,#fff); border:1px solid var(--hairline-color,#ddd); border-radius:6px; padding:16px; }
  .gestion-card h2 { margin-top:0; font-size:1.05rem; }
  .gestion-card ul { padding-left:20px; }
  .gestion-muted { color:var(--body-quiet-color,#666); }
  .gestion-actions { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 20px; }
  .gestion-table { width:100%; border-collapse:collapse; }
  .gestion-table th, .gestion-table td { border-bottom:1px solid var(--hairline-color,#ddd); padding:8px; text-align:left; vertical-align:top; }
  .gestion-money { white-space:nowrap; }
  .gestion-form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin:16px 0; }
  .gestion-form-grid label { display:block; font-weight:bold; margin-bottom:4px; }
  .gestion-form-grid input, .gestion-form-grid select { box-sizing:border-box; max-width:100%; padding:6px; width:100%; }
  .gestion-form-grid small { display:block; color:var(--body-quiet-color,#666); margin-top:4px; }
  .gestion-form-grid ul.errorlist, form > ul.errorlist { color:#ba2121; margin:4px 0; padding-left:20px; }
  .gestion-actions .button, button { background:var(--button-bg,#417690); border:0; border-radius:4px; color:#fff; cursor:pointer; padding:8px 12px; text-decoration:none; }
</style>
{% block gestion_content %}{% endblock %}
{% endblock %}
